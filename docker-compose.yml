
services:
  hough-cuda-2:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: hough-cuda-dev-2

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    volumes:
      - .:/workspace

    working_dir: /workspace

    stdin_open: true
    tty: true

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    command: /bin/bash
